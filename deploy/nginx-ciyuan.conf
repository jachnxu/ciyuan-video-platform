server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/ciyuan;
    index index.html;
    client_max_body_size 4096m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
        client_max_body_size 4096m;
    }

    location ^~ /media/ {
        alias /opt/ciyuan/storage/;
        add_header Cache-Control "public, max-age=604800";
        add_header Accept-Ranges bytes;
        sendfile on;
        tcp_nopush on;
        aio threads;
        directio 8m;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /livehls/ {
        alias /var/www/ciyuan/livehls/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
        default_type application/octet-stream;
    }

    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 121-43-245-66.sslip.io;

    ssl_certificate /etc/letsencrypt/live/121-43-245-66.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/121-43-245-66.sslip.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
