rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # 转 HLS，落到现有站点根目录下，由 80 端口静态直出
            hls on;
            hls_path /var/www/ciyuan/livehls;
            hls_fragment 2s;
            hls_playlist_length 30s;
            hls_cleanup on;

            # 观众走 HLS，不开放 RTMP 拉流
            deny play all;
        }
    }
}
